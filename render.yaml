# Render Blueprint: New > Blueprint, pick this repository. Needs a paid instance
# (free instances sleep and can't have a disk). See docs/hosting/render.md.
services:
  - type: web
    name: fridgedoor
    runtime: image
    image:
      url: ghcr.io/ravimody/fridgedoor:latest
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
    disk:
      name: fridgedoor-data
      mountPath: /data
      sizeGB: 1

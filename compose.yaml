# Fridgedoor with Docker Compose.
#
#   docker compose up -d                          # http://<this machine>:8080
#   docker compose --profile caddy up -d          # HTTPS with your own domain (set DOMAIN in .env)
#   docker compose --profile tailscale up -d      # HTTPS at https://fridgedoor.<tailnet>.ts.net (set TS_AUTHKEY)
#   docker compose --profile cloudflare up -d     # HTTPS through a Cloudflare Tunnel (set TUNNEL_TOKEN)
#
# With any HTTPS profile, also set FRIDGEDOOR_BIND=127.0.0.1 and TRUST_PROXY=true in .env.
# Otherwise plain HTTP stays open on port 8080 (Docker-published ports bypass ufw), and
# sign-in rate limits count every visitor as the proxy. deploy/install.sh sets both.
#
# Then print the one-time setup link:  docker compose exec fridgedoor fridgedoor setup-link
# Settings live in .env (copy .env.example); data lives in the fridgedoor-data volume.
name: fridgedoor

services:
  fridgedoor:
    image: ${FRIDGEDOOR_IMAGE:-ghcr.io/ravimody/fridgedoor:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${FRIDGEDOOR_BIND:-0.0.0.0}:${FRIDGEDOOR_PORT:-8080}:8080"
    volumes:
      - fridgedoor-data:/data
    extra_hosts:
      # Lets an Ollama or LM Studio server on this machine be reached as host.docker.internal.
      - "host.docker.internal:host-gateway"

  caddy:
    profiles: [caddy]
    image: caddy:2.11.7
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      # Required for this profile: the name that points at this server.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [fridgedoor]

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:v1.104.1
    hostname: ${TS_HOSTNAME:-fridgedoor}
    restart: unless-stopped
    environment:
      # Required for this profile: an auth key from the Tailscale admin console.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      # Funnel makes the address reachable from any phone; TS_SERVE_FILE=tailscale-serve-private.json keeps it inside your tailnet.
      - ./deploy/${TS_SERVE_FILE:-tailscale-serve.json}:/config/serve.json:ro
    depends_on: [fridgedoor]

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Required for this profile: from Cloudflare Zero Trust > Networks > Tunnels.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [fridgedoor]

volumes:
  fridgedoor-data:
  caddy-data:
  caddy-config:
  tailscale-state:

name: Docker image
# Publishes only tested code:
# - main: after CI passes for a push to main, as `main` and `sha-<short>` of the tested commit.
# - a `v*` tag: after the CI suite passes for the tagged commit (run here, as a tag push doesn't run CI),
#   as `latest`, the semver tags (1.2.3, 1.2, 1) and `sha-<short>`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  image:
    needs: ci
    # `always()` so main builds still run when the tag-only `ci` job is skipped. A workflow_run from a pull
    # request (even a fork's branch named main) never publishes: only CI for a push to this repository's main.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.ci.result == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
      )
    # Each platform builds on its own native runner. Under QEMU emulation the arm64 `pnpm install` crashed
    # (illegal instruction) and then hung until the job limit.
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - id: source
        env: { SHA: '${{ github.event.workflow_run.head_sha || github.sha }}' }
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: '${{ steps.source.outputs.sha }}' }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      # Pushed by digest only; the publish job tags the combined image.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - env: { DIGEST: '${{ steps.build.outputs.digest }}' }
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'digest-${{ matrix.arch }}', path: '${{ runner.temp }}/digests/*', retention-days: 1 }
  publish:
    needs: image
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - id: source
        env: { SHA: '${{ github.event.workflow_run.head_sha || github.sha }}' }
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'digest-*', merge-multiple: true, path: '${{ runner.temp }}/digests' }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # The semver patterns only match on tag pushes.
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=sha-${{ steps.source.outputs.short }}
      - working-directory: ${{ runner.temp }}/digests
        env: { IMAGE: 'ghcr.io/${{ github.repository }}' }
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:sha-${{ steps.source.outputs.short }}"
